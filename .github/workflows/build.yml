name: Build Android NDK SO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Build arm64-v8a and armeabi-v7a
        run: |
          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p build/$ABI
            cmake -B build/$ABI -S . \
              -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-24
            cmake --build build/$ABI
            mkdir -p output/$ABI
            cp build/$ABI/libnovascanner.so output/$ABI/
          done

      - name: Upload SO files
        uses: actions/upload-artifact@v4
        with:
          name: nova-native-libs
          path: output/
